project:
  name: "cafetiere-italienne.be"
  domain: "https://cafetiere-italienne.be"
  language: "fr"

content:
  scope:
    - "/comparatifs/"
  source_of_truth:
    - "scripts/comparison-content.mjs"
    - ".content/comparisons/*.json"
    - ".content/products/registry.json"
  generated_output: "comparatifs/*/index.html"
  content_type: "affiliate-comparison"
  mode: "auto"

quality:
  quality_reference: "/guides/comment-choisir-cafetiere-italienne/"
  draft_robots: "noindex,follow"
  published_robots: "index,follow"
  prohibit_word_count_quotas: true
  prohibit_heading_count_quotas: true
  prohibit_internal_link_quotas: true
  prohibit_comparison_type_templates: true
  require_cluster_structure_review: true

comparison:
  require_explicit_decision_logic: true
  require_criteria_before_recommendation: true
  require_reasonable_candidate_scope: true
  require_major_exclusion_reason_when_decision_relevant: true
  scoring_optional: true
  weighting_optional: true
  hard_gates_optional: true
  total_solution_cost_only_when_decision_relevant: true
  exhaustive_product_universe_required: false
  equivalence_engine_required: false
  affiliate_commission_must_not_affect_ranking: true
  comparison_type_defines_structure: false
  allowed_types:
    - BEST_OVERALL
    - USE_CASE
    - BUDGET
    - FEATURE_SPECIFIC
    - HEAD_TO_HEAD

products:
  registry: ".content/products/registry.json"
  require_registry_entry_for_recommended_product: true
  require_exact_model_or_variant_identity: true
  require_variant_specific_compatibility_when_relevant: true
  require_current_primary_source_for_hard_specs: true
  require_candidate_research_before_recommendation: true
  require_major_exclusion_reason_when_decision_relevant: true
  prohibit_candidate_selection_based_on_affiliate_availability: true
  product_module_workflow: ".github/workflows/apply-product-modules.yml"

evidence:
  prefer_primary_sources_for_hard_facts: true
  review_skill: ".agents/skills/evidence-based-reviews/SKILL.md"
  fact_check_skill: ".agents/skills/fact-check/SKILL.md"
  prohibit_model_memory_gap_filling: true
  prohibit_fake_hands_on: true
  editorial_judgment_is_not_a_measurement: true
  independent_or_user_evidence_required_for_experience_claims: true

seo:
  keyword_skill: ".agents/skills/seo-keyword/SKILL.md"
  content_audit_skill: ".agents/skills/seo-content-audit/SKILL.md"
  onpage_skill: ".agents/skills/seo-onpage/SKILL.md"
  technical_skill: ".agents/skills/seo-technical/SKILL.md"
  internal_linking_skill: ".agents/skills/internal-linking-audit/SKILL.md"
  require_unique_search_intent: true
  require_internal_link_review: true
  require_canonical_and_robots_review: true

geo:
  skill: ".agents/skills/geo-aeo-comparison/SKILL.md"
  require_answer_first_decision_blocks: true
  require_self_contained_claims_when_useful: true
  require_named_sources_for_decision_critical_claims: true
  require_entity_and_variant_disambiguation: true
  require_extractable_comparison_facts: true
  require_freshness_review: true
  require_structured_data_truthfulness: true
  prohibit_schema_for_content_not_visible_on_page: true
  draft_noindex_is_not_geo_failure: true
  prohibit_geo_keyword_stuffing: true

affiliation:
  skill: ".agents/skills/affiliate-value/SKILL.md"
  page_must_remain_useful_without_affiliate_links: true
  affiliate_commission_must_not_affect_candidates_or_ranking: true
  require_material_limitations: true
  require_alternatives_when_decision_relevant: true
  require_sponsored_nofollow_for_affiliate_links: true
  require_clear_affiliate_disclosure: true

editorial:
  brief_skill: ".agents/skills/content-brief-authoring/SKILL.md"
  writing_skill: ".agents/skills/content-and-copy/SKILL.md"
  humanizer_skill: ".agents/skills/humanizer/SKILL.md"
  general_writing_skill: ".agents/skills/general-writing/SKILL.md"
  anti_ai_slop_skill: ".agents/skills/anti-ai-slop/SKILL.md"
  editorial_qa_skill: ".agents/skills/editorial-qa/SKILL.md"
  prohibit_high_severity_ai_slop: true
  prohibit_unjustified_structural_cloning: true
  prohibit_editor_facing_metadiscourse: true

workflow:
  comparisons_dir: ".content/comparisons"
  products_dir: ".content/products"
  reviews_dir: ".content/reviews"
  content_workflow: ".agents/skills/comparison-content-workflow/SKILL.md"
  analysis_workflow: ".agents/skills/comparison-analysis-workflow/SKILL.md"
  final_review_mode: "PUBLISH_REVIEW"
  machine_validator: "validate_comparisons.py"
  workflow_validator: "validate_comparison_workflow.py"
  indexation_manifest: "comparison_publication.py"
  require_analysis_pass_before_human_validation: true
  require_human_validation_before_publish: true
  allow_automatic_merge: false
  allow_automatic_indexation: false
  require_explicit_route_manifest_for_indexation: true

upstream_skill_chain:
  - "seo-content-audit | rampstackco/claude-skills"
  - "seo-keyword | rampstackco/claude-skills"
  - "jobs-to-be-done | wondelai/skills"
  - "evidence-based-reviews | rampstackco/claude-skills"
  - "fact-check | existing recovery workflow"
  - "affiliate-value | existing affiliate workflow"
  - "content-brief-authoring | rampstackco/claude-skills"
  - "content-and-copy | rampstackco/claude-skills"
  - "improve-aeo-geo adapted as geo-aeo-comparison | onvoyage-ai/gtm-engineer-skills (MIT)"
  - "humanizer | external skill"
  - "general-writing | msimchowitz/writing-skills"
  - "anti-ai-slop | external skill"
  - "seo-onpage | rampstackco/claude-skills"
  - "seo-technical | external skill"
  - "internal-linking-audit | existing external skill"
  - "editorial-qa | existing workflow"

editorial_chain:
  - comparison_analysis_audit_for_existing_page
  - seo_keyword_intent_and_cluster
  - jobs_to_be_done_when_relevant
  - seo_content_audit_preserve_existing_value
  - product_registry_and_candidate_research
  - evidence_based_reviews_and_fact_check
  - affiliate_value_and_editorial_independence
  - custom_scope_criteria_and_recommendation_logic
  - content_brief_authoring
  - content_and_copy
  - post_draft_fact_check
  - geo_aeo_citability_and_entity_clarity
  - humanizer_and_general_writing
  - anti_ai_slop
  - internal_linking_audit
  - seo_onpage_and_technical
  - editorial_qa
  - machine_validation
  - comparison_analysis_publish_review
  - human_validation
  - explicit_indexation_approval

quality_gate:
  require_sources_for_factual_claims: true
  require_limitations_for_recommended_products: true
  require_product_identity_and_variant_traceability: true
  require_geo_review: true
  require_affiliate_review: true
  require_anti_ai_slop_review: true
  require_seo_review: true
  require_internal_linking_review: true
  require_noindex_in_draft: true
  require_manifest_for_indexed_pages: true
  prohibit_fake_test_language: true
  prohibit_merchant_rewrite_without_original_value: true
  prohibit_high_severity_ai_slop: true
  prohibit_unresolved_cannibalization: true
  prohibit_unjustified_structural_cloning: true
  prohibit_affiliate_influence_on_ranking: true
  prohibit_mandatory_fake_precision: true

orchestration:
  min_existing_skill_share: 0.80
  custom_allowed:
    - "orchestration"
    - "comparison candidate sanity"
    - "criteria and recommendation traceability"
    - "cluster similarity / cannibalization"
    - "site-specific publication state"
  custom_forbidden_when_existing_skill_covers_need: true
