name: Temporary skill context adaptation

on:
  push:
    branches:
      - adapt-skills-cafetiere

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Adapt only legacy site and product context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('AGENTS.md')]
          roots += [p for p in Path('.agents').rglob('*') if p.is_file()]

          replacements = [
              ('bloc-notes-numeriques.fr', 'cafetiere-italienne.be'),
              ('italiaanse-percolator.nl', 'cafetiere-italienne.be'),
              ('MarcW88/italiaanse-percolator', 'MarcW88/cafetiere-italienne'),

              ('- prise de notes pendant une réunion ;', '- préparation d’un café avec une cafetière italienne ;'),
              ('- étudiant utilisant un appareil E Ink générique dans un contexte de cours ;', '- personne utilisant une cafetière italienne générique dans une cuisine ;'),
              ('- lecture et annotation de documents sans interface ou marque identifiable ;', '- préparation et service du café sans marque identifiable ;'),
              ('- bureau, bibliothèque, déplacement, travail nomade ;', '- cuisine, table de petit-déjeuner, déplacement ou camping ;'),
              ('- geste d\'écriture ou contexte d\'organisation documentaire.', '- geste de dosage, de mouture ou de service du café.'),

              ('- alternatives raisonnables au bloc-notes E Ink ;', '- alternatives raisonnables à la cafetière italienne ;'),
              ('Une page n\'est pas justifiée uniquement parce qu\'un mot-clé combine `bloc-notes numérique + étudiant/professionnel/dessin/etc.`.', 'Une page n\'est pas justifiée uniquement parce qu\'un mot-clé combine `cafetière italienne + induction/inox/capacité/etc.`.'),
              ('- absence de cas où le bloc-notes numérique est un mauvais choix.', '- absence de cas où la cafetière italienne est un mauvais choix.'),
              ('- `/usages/prise-de-notes-etudiant/` vs `/comparatifs/bloc-notes-numerique-etudiant/` ;', '- `/usages/cafe-pour-deux/` vs `/comparatifs/petite-cafetiere-italienne/` ;'),
              ('- `/usages/prise-de-notes-professionnelle/` vs `/comparatifs/bloc-notes-numerique-professionnel/`.', '- `/usages/cafe-sur-induction/` vs `/comparatifs/cafetiere-italienne-induction/`.'),
              ('- `/usages/annotation-pdf/` vs `/guides/annoter-pdf-tablette-e-ink/`.', '- `/usages/cafe-sur-induction/` vs `/guides/cafetiere-italienne-induction-compatibilite/`.'),
              ('- alternatives hors E Ink considérées lorsqu\'elles sont pertinentes ;', '- alternatives à la cafetière italienne considérées lorsqu\'elles sont pertinentes ;'),

              ('Une famille peut être, lorsque le sujet le justifie : appareil minimaliste, plateforme ouverte, grand écran PDF, couleur, liseuse avec stylet, tablette LCD, papier ou workflow hybride.', 'Une famille peut être, lorsque le sujet le justifie : cafetière aluminium, cafetière inox, modèle induction, modèle électrique, petite capacité, grande capacité, machine expresso ou autre méthode d’extraction.'),
              ('Pour les capacités produit ou logiciel susceptibles d\'évoluer, privilégier des sources primaires et dater la vérification.', 'Pour les caractéristiques produit, compatibilités ou prix susceptibles d’évoluer, privilégier des sources primaires et dater la vérification.'),
              ('- ne jamais inventer test, expérience personnelle, autonomie mesurée, prix ou avis utilisateur ;', '- ne jamais inventer test, expérience personnelle, température mesurée, temps d’extraction, prix ou avis utilisateur ;'),
              ('Utiliser lorsqu\'une sous-question mérite une explication autonome : fonctionnement E Ink, OCR, export, synchronisation, taille d\'écran, prix, latence, annotation PDF procédurale, etc.', 'Utiliser lorsqu\'une sous-question mérite une explication autonome : fonctionnement d’une cafetière italienne, compatibilité induction, matériau, mouture, dosage, capacité, entretien, fuite ou remplacement du joint, etc.'),
              ('- aucune alternative hors E Ink n\'est considérée alors qu\'elle est plausible ;', '- aucune alternative à la cafetière italienne n’est considérée alors qu’elle est plausible ;'),

              ('- généralités applicables à n\'importe quelle tablette E Ink.', '- généralités applicables à n’importe quelle cafetière italienne.'),
              ('- différence éditoriale trop faible entre `meilleur`, `étudiant`, `professionnel`, `tablette E Ink`, etc.', '- différence éditoriale trop faible entre `meilleure`, `induction`, `inox`, `électrique`, etc.'),

              ('Le job principal doit pouvoir être formulé sans mentionner « bloc-notes numérique », « tablette E Ink », une marque ou un modèle. Si la solution apparaît dans le job, le cadrage est trop produit-centric.', 'Le job principal doit pouvoir être formulé sans mentionner « cafetière italienne », un matériau, une marque ou un modèle. Si la solution apparaît dans le job, le cadrage est trop produit-centric.'),
              ('Une catégorie comme « étudiant », « professionnel » ou « dessinateur » n\'est pas encore un job.', 'Une catégorie comme « amateur de café », « utilisateur quotidien » ou « campeur » n’est pas encore un job.'),
              ('- le type de documents ou informations manipulés ;', '- le type de café, la quantité ou le matériel manipulé ;'),
              ('- l\'environnement physique ou logiciel ;', '- l’environnement physique et la source de chaleur disponible ;'),
              ('Ce que l\'utilisateur doit réellement accomplir : écrire, annoter, retrouver, transférer, lire, dessiner, classer, partager, etc.', 'Ce que l’utilisateur doit réellement accomplir : doser, moudre, chauffer, extraire, servir, nettoyer, transporter, etc.'),
              ('Ce que l\'utilisateur cherche à ressentir ou éviter : rester concentré, réduire la charge mentale, avoir confiance dans la sauvegarde, éviter la frustration d\'un workflow lent, etc.', 'Ce que l’utilisateur cherche à ressentir ou éviter : obtenir un résultat fiable, garder un rituel simple, éviter un café amer ou brûlé, limiter la frustration d’une préparation imprévisible, etc.'),
              ('Ce que l\'usage change dans l\'interaction avec d\'autres personnes : partager un document propre, travailler sans écran lumineux en réunion, présenter des notes lisibles, collaborer, etc.', 'Ce que l’usage change dans l’interaction avec d’autres personnes : préparer plusieurs cafés, servir des invités, partager un rituel ou s’adapter aux préférences du foyer, etc.'),
              ('Le contenu doit traiter les freins autant que les bénéfices. Une page usage crédible explique donc aussi pourquoi quelqu\'un pourrait rester avec du papier, un ordinateur, une tablette classique ou son système actuel.', 'Le contenu doit traiter les freins autant que les bénéfices. Une page usage crédible explique donc aussi pourquoi quelqu’un pourrait rester avec une machine expresso, une cafetière filtre, une machine à capsules, une French press ou sa méthode actuelle.'),
              ('- cahier papier ;\n- ordinateur portable ;\n- tablette LCD ;\n- liseuse ;\n- smartphone ;\n- impression papier ;\n- combinaison de plusieurs outils ;\n- ne rien changer.', '- machine expresso ;\n- cafetière filtre ;\n- machine à capsules ;\n- French press ;\n- AeroPress ;\n- café soluble ;\n- combinaison de plusieurs méthodes ;\n- ne rien changer.'),
              ('Ne pas limiter la comparaison aux appareils E Ink.', 'Ne pas limiter la comparaison aux cafetières italiennes.'),
              ('Une caractéristique peut aider à vendre l\'appareil sans améliorer l\'usage quotidien. Pour une page `/usages/`, privilégier les critères qui changent le Little Hire : friction d\'import, vitesse pour retrouver une note, lisibilité réelle du PDF, simplicité d\'export, poids porté tous les jours, etc.', 'Une caractéristique peut aider à vendre le produit sans améliorer l’usage quotidien. Pour une page `/usages/`, privilégier les critères qui changent le Little Hire : simplicité du dosage, régularité de l’extraction, compatibilité avec la plaque, capacité adaptée, nettoyage, encombrement ou transport, etc.'),

              ('- oublier le stylet, l\'étui ou un abonnement nécessaire ;', '- oublier le joint, l’adaptateur induction ou un accessoire nécessaire ;'),

              ('> Applique `comparison-content-workflow` à `/comparatifs/meilleur-bloc-notes-numerique/`.', '> Applique `comparison-content-workflow` à `/comparatifs/meilleure-cafetiere-italienne/`.'),
              ('  --route /guides/choisir-bloc-notes-numerique/ \\', '  --route /guides/comment-choisir-cafetiere-italienne/ \\'),
              ('7. Considérer les alternatives hors E Ink et les situations où le bloc-notes numérique n’est pas le bon outil.', '7. Considérer les alternatives à la cafetière italienne et les situations où la cafetière italienne n’est pas le bon choix.'),

              ('bloc-notes numériques', 'cafetières italiennes'),
              ('bloc-notes numérique', 'cafetière italienne'),
              ('bloc-notes-numeriques', 'cafetiere-italienne'),
              ('bloc-notes-numerique', 'cafetiere-italienne'),
          ]

          changed = []
          for path in roots:
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # The visual-review helper is part of the skill package: keep its logic,
          # but replace only the hard-coded legacy route examples with cafetiere context.
          visual = Path('.agents/skills/site-design-review/scripts/run-visual-review.mjs')
          text = visual.read_text(encoding='utf-8')
          route_blocks = {
              'BRAND_ROUTES': [
                  '/marques/',
                  '/marques/bialetti/',
                  '/marques/alessi/',
              ],
              'COMPARISON_ROUTES': [
                  '/comparatifs/',
                  '/comparatifs/meilleure-cafetiere-italienne/',
                  '/comparatifs/cafetiere-italienne-induction/',
                  '/comparatifs/cafetiere-italienne-inox/',
                  '/comparatifs/cafetiere-italienne-electrique/',
                  '/comparatifs/cafetiere-italienne-design/',
                  '/comparatifs/petite-cafetiere-italienne/',
              ],
              'USAGE_ROUTES': [
                  '/usages/',
                  '/usages/cafe-quotidien/',
                  '/usages/cafe-pour-deux/',
                  '/usages/cafe-en-famille/',
                  '/usages/cafe-sur-induction/',
                  '/usages/camping-voyage/',
                  '/usages/remplacer-machine-capsules/',
              ],
              'GUIDE_ROUTES': [
                  '/guides/',
                  '/guides/comment-choisir-cafetiere-italienne/',
                  '/guides/comment-utiliser-cafetiere-italienne/',
                  '/guides/cafetiere-italienne-aluminium-ou-inox/',
                  '/guides/cafetiere-italienne-induction-compatibilite/',
                  '/guides/cafetiere-italienne-vs-espresso/',
                  '/guides/mouture-cafetiere-italienne/',
                  '/guides/dosage-cafe-cafetiere-italienne/',
                  '/guides/nettoyer-cafetiere-italienne/',
                  '/guides/detartrer-cafetiere-italienne/',
                  '/guides/changer-joint-cafetiere-italienne/',
                  '/guides/cafetiere-italienne-cafe-amer-brule/',
                  '/guides/cafetiere-italienne-fuite-vapeur/',
              ],
              'DEAL_ROUTES': [
                  '/bons-plans/',
                  '/bons-plans/cafetiere-italienne/',
                  '/bons-plans/bialetti/',
                  '/bons-plans/alessi/',
                  '/bons-plans/cafetiere-italienne-occasion/',
                  '/bons-plans/black-friday/',
              ],
          }
          for name, routes in route_blocks.items():
              block = f"const {name} = [\n" + ''.join(f"  '{route}',\n" for route in routes) + '];'
              text, count = re.subn(rf"const {name} = \[.*?\];", block, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Could not replace {name}')
          original_visual = visual.read_text(encoding='utf-8')
          if text != original_visual:
              visual.write_text(text, encoding='utf-8')
              if str(visual) not in changed:
                  changed.append(str(visual))

          print(f'CHANGED_FILES={len(changed)}')
          for path in sorted(changed):
              print(path)
          PY

          echo '=== Legacy-reference validation ==='
          if grep -RIniE \
            'bloc[- _]?notes|italiaanse[- _]?percolator|E[ -]?Ink|reMarkable|Kindle Scribe|Kobo Elipsa|Supernote|Boox|\bOCR\b|stylet|liseuse|prise-de-notes|prise de notes|notes manuscrites|tablette-e-ink|annoter-pdf|encre-electronique|synchroniser-notes|exporter-notes|organiser-notes|transfert-notes|imprimer-notes' \
            .agents AGENTS.md; then
            echo 'ERROR: legacy notebook/percolator context remains'
            exit 1
          fi

          echo '=== Scope validation ==='
          git add -A .agents AGENTS.md
          bad="$(git diff --cached --name-only | grep -vE '^(\.agents/|AGENTS\.md$)' || true)"
          if [ -n "$bad" ]; then
            echo 'ERROR: out-of-scope files changed:'
            echo "$bad"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'No contextual changes needed.'
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: adapt skill context for cafetiere-italienne"
          git push origin HEAD:adapt-skills-cafetiere
