name: Test reviewed 10-cup capacity page

on:
  push:
    branches:
      - capacity-10-tasses-test
    paths:
      - 'scripts/capacity-10-tasses-reviewed.mjs'
      - 'scripts/apply-capacity-10-tasses-reviewed.mjs'
      - 'scripts/apply-capacity-hub-reviewed.mjs'
      - 'scripts/build.mjs'
      - 'package.json'
      - 'validate_capacities.py'
      - '.content/capacities/evidence-cafetiere-italienne-10-tasses-2026-09-13.md'
      - '.content/briefs/cafetiere-italienne-10-tasses.md'
      - '.content/reviews/cafetiere-italienne-10-tasses.md'
      - '.github/workflows/test-capacity-10-tasses.yml'

permissions:
  contents: read

jobs:
  validate-10-cup-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reviewed site
        run: npm run build
      - name: Check generated site
        run: npm run check
      - name: Validate capacity publication blockers
        run: python3 validate_capacities.py
      - name: Validate 10-cup editorial markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path('capacites/cafetiere-italienne-10-tasses/index.html').read_text(encoding='utf-8')
          required = [
              'Cafetière italienne 10 tasses : combien de ml et quand la choisir ?',
              '460 à 500 ml de capacité annoncée',
              '9, 10 ou 12 tasses : partez du volume',
              'Capacité annoncée et café réellement obtenu',
              'Pourquoi nous ne désignons pas une « meilleure cafetière 10 tasses » ici',
              'Bialetti Venus',
              'CRISTEL Torino',
              'Alessi 9090/M',
              'Cecotec Moking 1000',
              'Pedrini Steel Moka',
              'id="sources"',
          ]
          missing = [x for x in required if x not in page]
          if missing:
              raise SystemExit('FAIL missing reviewed 10-cup markers: ' + ', '.join(missing))
          if 'name="robots" content="noindex,follow"' not in page:
              raise SystemExit('FAIL 10-cup page must remain noindex,follow')
          if re.search(r'10\s+tasses?\s*=\s*10\s+personnes?', page, re.I):
              raise SystemExit('FAIL unsupported cups-to-people equation')
          forbidden = ['la meilleure cafetière 10 tasses est', 'notre gagnante', 'top 5', 'nous avons testé']
          low = page.lower()
          for marker in forbidden:
              if marker in low:
                  raise SystemExit('FAIL forbidden comparison/test marker: ' + marker)
          print('PASS: reviewed 10-cup content markers and capacity/comparison boundary are valid')
          PY
      - name: Ensure other child capacity pages are untouched by reviewed override
        run: |
          git diff --exit-code -- \
            capacites/cafetiere-italienne-2-tasses/index.html \
            capacites/cafetiere-italienne-4-tasses/index.html \
            capacites/cafetiere-italienne-6-tasses/index.html \
            capacites/cafetiere-italienne-12-tasses/index.html
