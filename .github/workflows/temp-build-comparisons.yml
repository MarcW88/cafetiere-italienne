name: Temporary comparison build

on:
  push:
    branches:
      - comparison-pages

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire comparison pages and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build=Path('scripts/build.mjs')
          text=build.read_text(encoding='utf-8')
          import_line="import { comparisonPages } from './comparison-content.mjs';"
          if import_line not in text:
              anchor="import { guideTroubleshootingPages } from './guide-content-troubleshooting.mjs';\n"
              if anchor not in text:
                  raise SystemExit('comparison import anchor missing')
              text=text.replace(anchor,anchor+import_line+'\n',1)

          old="const custom=cat==='guides'?(guidePages[slug]||guideHowToPages[slug]||guideFirstUsePages[slug]||guideBrewBasicsPages[slug]||guideMaterialsCarePages[slug]||guideTroubleshootingPages[slug]):null;"
          new="const custom=cat==='guides'?(guidePages[slug]||guideHowToPages[slug]||guideFirstUsePages[slug]||guideBrewBasicsPages[slug]||guideMaterialsCarePages[slug]||guideTroubleshootingPages[slug]):cat==='comparatifs'?comparisonPages[slug]:null;"
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('comparison custom-page anchor missing')

          lines=text.splitlines()
          replaced=False
          for i,line in enumerate(lines):
              if line.strip().startswith("fs.writeFileSync(path.join(dir,'index.html'),shell(labels[cat],") and "Retrouvez toutes les pages prévues" in line:
                  original=line.strip()
                  hub="fs.writeFileSync(path.join(dir,'index.html'),shell('Comparatifs de cafetières italiennes',`<section class=\"page-hero\"><div class=\"container\"><div class=\"breadcrumbs\"><a href=\"/\">Accueil</a> · Comparatifs</div><span class=\"eyebrow\">Choisir</span><h1>Comparatifs de cafetières italiennes</h1><p>Six comparatifs pour choisir selon votre vraie contrainte : plaque, matériau, alimentation, design ou petit format.</p></div></section><section class=\"section\"><div class=\"container directory\">${links}</div></section>`,'Comparez les cafetières italiennes selon la plaque, le matériau, le design, le format ou l’alimentation.',{robots:'noindex,follow',canonical:'/comparatifs/'}));"
                  lines[i]=" if(cat==='comparatifs'){"+hub+"}else{"+original+"}"
                  replaced=True
                  break
          if not replaced and "canonical:'/comparatifs/'" not in text:
              raise SystemExit('comparison hub generation anchor missing')
          text='\n'.join(lines)+'\n'
          build.write_text(text,encoding='utf-8')

          css=Path('assets/styles.css')
          c=css.read_text(encoding='utf-8')
          marker='/* Comparison editorial content */'
          if marker not in c:
              c += r'''

/* Comparison editorial content */
.comparison-layout{align-items:start}.content-main{min-width:0}.content-main>section{padding:34px 0;border-bottom:1px solid var(--line)}.content-main>section:first-child{padding-top:0}.content-main>section:last-child{border-bottom:0}.content-main h2{font-size:clamp(1.9rem,3vw,2.65rem);margin-bottom:18px}.content-main h3{font-size:1.45rem;margin:26px 0 10px}.content-main p{margin:0 0 16px}.content-main ul{padding-left:1.3rem}.comparison-picks{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pick{padding:22px;background:var(--paper);border:1px solid var(--line);border-radius:18px}.pick h3{margin-top:7px}.source-list li+li{margin-top:10px}@media(max-width:760px){.comparison-picks{grid-template-columns:1fr}}
'''
              css.write_text(c,encoding='utf-8')
          PY

          npm run build
          npm run check
          python3 validate_comparisons.py

          for slug in meilleure-cafetiere-italienne cafetiere-italienne-induction cafetiere-italienne-inox cafetiere-italienne-electrique cafetiere-italienne-design petite-cafetiere-italienne; do
            page="comparatifs/$slug/index.html"
            test -f "$page"
            grep -q '<meta name="robots" content="noindex,follow">' "$page"
            grep -q '<article class="content-main">' "$page"
            grep -q 'id="sources"' "$page"
            grep -q "https://cafetiere-italienne.be/comparatifs/$slug/" "$page"
          done
          grep -q '<meta name="robots" content="noindex,follow">' comparatifs/index.html

          git add scripts/build.mjs assets/styles.css comparatifs
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: build comparison cluster"
          git push origin HEAD:comparison-pages
