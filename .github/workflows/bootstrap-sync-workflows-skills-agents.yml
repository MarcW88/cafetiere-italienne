name: Bootstrap exact workflows skills agents sync

on:
  push:
    branches:
      - sync-workflows-skills-agents

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-workflows-skills-agents
          fetch-depth: 0

      - name: Copy requested scope exactly
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/MarcW88/bloc-notes-numerique.git /tmp/source
          git -C /tmp/source checkout --quiet 534e9fd7e0fc2f7bd83da5b053987ac327c4e9fe

          rm -rf .agents .github/workflows AGENTS.md
          mkdir -p .github
          cp -a /tmp/source/.agents ./.agents
          cp -a /tmp/source/.github/workflows ./.github/workflows
          cp -a /tmp/source/AGENTS.md ./AGENTS.md

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          src = Path('/tmp/source')
          dst = Path('.')
          roots = ['.agents', '.github/workflows', 'AGENTS.md']

          def manifest(base):
              out = {}
              for root in roots:
                  p = base / root
                  if p.is_file():
                      out[root] = hashlib.sha256(p.read_bytes()).hexdigest()
                  elif p.is_dir():
                      for f in sorted(x for x in p.rglob('*') if x.is_file()):
                          rel = f.relative_to(base).as_posix()
                          out[rel] = hashlib.sha256(f.read_bytes()).hexdigest()
                  else:
                      raise SystemExit(f'Missing required path: {p}')
              return out

          sm = manifest(src)
          dm = manifest(dst)
          if sm != dm:
              print('ERROR: copied files differ from source')
              missing = sorted(set(sm) - set(dm))
              extra = sorted(set(dm) - set(sm))
              changed = sorted(k for k in set(sm) & set(dm) if sm[k] != dm[k])
              print('missing', missing)
              print('extra', extra)
              print('changed', changed)
              sys.exit(1)
          print(f'VERIFIED_EXACT_FILE_COUNT={len(sm)}')
          print('VERIFIED_SHA256_IDENTICAL=true')
          PY

          git add -A .agents .github/workflows AGENTS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync workflows skills and agents from bloc-notes-numerique"
          echo "SYNC_COMMIT_SHA=$(git rev-parse HEAD)"
          git push origin HEAD:sync-workflows-skills-agents
