name: Temporary first-use guide build

on:
  push:
    branches:
      - guide-premiere-utilisation

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire first-use Guide source and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build = Path('scripts/build.mjs')
          text = build.read_text(encoding='utf-8')
          import_line = "import { guideFirstUsePages } from './guide-content-first-use.mjs';"
          if import_line not in text:
              text = text.replace(
                  "import { guideHowToPages } from './guide-content-howto.mjs';\n",
                  "import { guideHowToPages } from './guide-content-howto.mjs';\n" + import_line + "\n",
                  1,
              )

          old = "const custom=cat==='guides'?(guidePages[slug]||guideHowToPages[slug]):null;"
          new = "const custom=cat==='guides'?(guidePages[slug]||guideHowToPages[slug]||guideFirstUsePages[slug]):null;"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Could not wire guideFirstUsePages into build')
          build.write_text(text, encoding='utf-8')
          PY

          npm run build
          npm run check
          python3 validate_guide_quality.py

          test -f guides/premiere-utilisation-cafetiere-italienne/index.html
          grep -q '<meta name="robots" content="noindex,follow">' guides/premiere-utilisation-cafetiere-italienne/index.html
          grep -q '<link rel="canonical" href="https://cafetiere-italienne.be/guides/premiere-utilisation-cafetiere-italienne/">' guides/premiere-utilisation-cafetiere-italienne/index.html
          grep -q '<article class="guide-article content-main">' guides/premiere-utilisation-cafetiere-italienne/index.html
          grep -q 'id="sources"' guides/premiere-utilisation-cafetiere-italienne/index.html

          git add scripts/build.mjs scripts/guide-content-first-use.mjs guides/premiere-utilisation-cafetiere-italienne/index.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: build first-use moka guide"
          git push origin HEAD:guide-premiere-utilisation
