name: Regenerate and validate comparison cluster

on:
  pull_request:
    paths:
      - "scripts/comparison-content.mjs"
      - ".content/comparisons/**"
      - ".content/products/registry.json"
      - ".content/reviews/*.comparison-review.md"
      - "comparison-workflow.config.yaml"
      - "comparison_publication.py"
      - "validate_comparisons.py"
      - "validate_comparison_workflow.py"
      - ".agents/skills/comparison-content-workflow/**"
      - ".agents/skills/comparison-analysis-workflow/**"
      - ".agents/skills/geo-aeo-comparison/**"
      - ".agents/skills/seo-keyword/**"
      - ".agents/skills/seo-content-audit/**"
      - ".agents/skills/seo-onpage/**"
      - ".agents/skills/seo-technical/**"
      - ".agents/skills/internal-linking-audit/**"
      - ".agents/skills/content-brief-authoring/**"
      - ".agents/skills/content-and-copy/**"
      - ".agents/skills/jobs-to-be-done/**"
      - ".agents/skills/evidence-based-reviews/**"
      - ".agents/skills/fact-check/**"
      - ".agents/skills/affiliate-value/**"
      - ".agents/skills/humanizer/**"
      - ".agents/skills/general-writing/**"
      - ".agents/skills/anti-ai-slop/**"
      - ".agents/skills/editorial-qa/**"
      - ".github/workflows/regenerate-comparisons.yml"
  push:
    branches: [main]
    paths:
      - "scripts/comparison-content.mjs"
      - ".content/comparisons/**"
      - ".content/products/registry.json"
      - ".content/reviews/*.comparison-review.md"
      - "comparison-workflow.config.yaml"
      - "comparison_publication.py"
      - "validate_comparisons.py"
      - "validate_comparison_workflow.py"
      - ".agents/skills/comparison-content-workflow/**"
      - ".agents/skills/comparison-analysis-workflow/**"
      - ".agents/skills/geo-aeo-comparison/**"
      - ".agents/skills/seo-keyword/**"
      - ".agents/skills/seo-content-audit/**"
      - ".agents/skills/seo-onpage/**"
      - ".agents/skills/seo-technical/**"
      - ".agents/skills/internal-linking-audit/**"
      - ".agents/skills/content-brief-authoring/**"
      - ".agents/skills/content-and-copy/**"
      - ".agents/skills/jobs-to-be-done/**"
      - ".agents/skills/evidence-based-reviews/**"
      - ".agents/skills/fact-check/**"
      - ".agents/skills/affiliate-value/**"
      - ".agents/skills/humanizer/**"
      - ".agents/skills/general-writing/**"
      - ".agents/skills/anti-ai-slop/**"
      - ".agents/skills/editorial-qa/**"
      - ".github/workflows/regenerate-comparisons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate comparison workflow contract
        run: python3 validate_comparison_workflow.py

      - name: Generate site from source of truth
        run: npm run build

      - name: Check generated site
        run: npm run check

      - name: Validate comparison pages and publication state
        run: python3 validate_comparisons.py

      - name: Re-check workflow gates after generation
        run: python3 validate_comparison_workflow.py

      - name: Commit generated comparison pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- comparatifs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparatifs
          git commit -m "content: regenerate comparison pages"
          git pull --rebase origin main
          git push origin HEAD:main
