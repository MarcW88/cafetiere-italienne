name: TEMP integrate exact comparison upstream

on:
  push:
    branches: [comparison-workflow-exact-port]
    paths:
      - ".github/workflows/temp-integrate-comparison-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: comparison-workflow-exact-port
          fetch-depth: 0
      - name: Preserve exact upstream copies of site-specific files
        run: |
          set -euo pipefail
          mkdir -p .upstream/bloc-notes-comparison
          for f in comparison-workflow.config.yaml comparison_pages.py comparison_bespoke_priority_20260909.py comparison_publication.py validate_product_cards.py validate_comparisons.py; do
            cp "$f" ".upstream/bloc-notes-comparison/$f"
          done
          cp .github/workflows/regenerate-comparisons.yml .upstream/bloc-notes-comparison/regenerate-comparisons.yml
      - name: Create Cafetiere site adapter data
        run: |
          cat > comparison_pages.py <<'PY'
          COMPARISON_PAGES = {
              'meilleure-cafetiere-italienne': {
                  'type': 'best_overall',
                  'query': 'meilleure cafetière italienne',
                  'job': 'choisir une cafetière moka adaptée à sa plaque, son volume habituel et ses priorités d’usage',
              },
              'cafetiere-italienne-induction': {
                  'type': 'feature_specific',
                  'query': 'cafetière italienne induction',
                  'job': 'choisir une moka réellement compatible avec sa plaque à induction et la taille voulue',
              },
              'cafetiere-italienne-inox': {
                  'type': 'feature_specific',
                  'query': 'cafetière italienne inox',
                  'job': 'choisir une moka en inox selon la plaque, la capacité et les contraintes d’entretien',
              },
              'cafetiere-italienne-electrique': {
                  'type': 'feature_specific',
                  'query': 'cafetière italienne électrique',
                  'job': 'choisir une moka électrique selon la capacité, l’autonomie et les fonctions réellement utiles',
              },
              'cafetiere-italienne-design': {
                  'type': 'feature_specific',
                  'query': 'cafetière italienne design',
                  'job': 'choisir une moka dont le design compte sans sacrifier les contraintes fonctionnelles décisives',
              },
              'petite-cafetiere-italienne': {
                  'type': 'feature_specific',
                  'query': 'petite cafetière italienne',
                  'job': 'choisir un petit format cohérent avec le volume réellement bu et, si nécessaire, la détection induction',
              },
          }
          CRITERIA_LABELS = {}
          PY

          cat > comparison_bespoke_priority_20260909.py <<'PY'
          """Cafetière site adapter for the exact Bloc Notes comparison engine.

          Until each URL is rewritten through comparison-content-workflow, preserve the
          currently rendered article body. This prevents the upstream legacy renderer
          from imposing a template while CLUSTER_AUDIT is being redone.
          """
          from pathlib import Path
          import re

          ROOT = Path(__file__).resolve().parent
          SLUGS = (
              'meilleure-cafetiere-italienne',
              'cafetiere-italienne-induction',
              'cafetiere-italienne-inox',
              'cafetiere-italienne-electrique',
              'cafetiere-italienne-design',
              'petite-cafetiere-italienne',
          )

          def _existing_article(slug: str) -> str:
              page = ROOT / 'comparatifs' / slug / 'index.html'
              html = page.read_text(encoding='utf-8')
              match = re.search(r'<article class="content-main">(.*?)</article>', html, re.S | re.I)
              if not match:
                  raise RuntimeError(f'article.content-main missing for {slug}')
              return match.group(1).strip()

          CONTENT = {slug: _existing_article(slug) for slug in SLUGS}
          META = {}
          PY

          cat > comparison_publication.py <<'PY'
          """Explicit comparison routes approved for indexation after human review.

          Empty by default. A workflow PASS never indexes a page automatically.
          """
          INDEXABLE_COMPARISON_ROUTES = set()
          PY
      - name: Adapt site config without altering upstream skill logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('comparison-workflow.config.yaml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('name: "bloc-notes-numeriques.fr"', 'name: "cafetiere-italienne.be"')
          s = s.replace('domain: "https://bloc-notes-numeriques.fr"', 'domain: "https://cafetiere-italienne.be"')
          s = s.replace('quality_reference: "/guides/prix-bloc-notes-numerique/"', 'quality_reference: "/guides/comment-choisir-cafetiere-italienne/"')
          p.write_text(s, encoding='utf-8')
          PY

          cat > comparison-workflow.cafetiere-extension.yaml <<'YAML'
          # Site-specific extension. The upstream Bloc Notes workflow and skills remain vendored unchanged.
          project: cafetiere-italienne.be
          custom_share_target: "<=20%"
          custom_scope:
            - comparison URL mapping and product scope
            - cafetiere-specific evidence / candidate research
            - affiliate placements after page approval
            - GEO/AEO post-draft gate
            - site publication state
          geo:
            skill: ".agents/skills/geo-aeo-comparison/SKILL.md"
            run_after_fact_check: true
            run_before_final_publish_review: true
            rules:
              - entity_and_variant_disambiguation
              - extractable_decision_claims
              - source_attribution_for_decision_critical_claims
              - truthful_structured_data
              - no_geo_keyword_stuffing
          YAML
      - name: Put product-affiliate data into the exact Bloc Notes schema
        run: |
          cp .content/products/affiliate.upstream.json .content/products/affiliate.json
          cat > .content/products/registry.json <<'JSON'
          {
            "schema_version": 2,
            "products": {}
          }
          JSON
          cat > .content/products/placements.json <<'JSON'
          {
            "schema_version": 3,
            "policy": {
              "max_modules_per_page": 1,
              "max_products_per_module": 3,
              "purpose": "decision_support_only",
              "excluded_sections": ["brands", "deals", "hubs", "informational_guides"]
            },
            "sections": {
              "comparisons": {"base_path": "comparatifs", "pages": {}},
              "usages": {"base_path": "usages", "pages": {}},
              "guides": {"base_path": "guides", "pages": {}}
            }
          }
          JSON
          cat > .content/products/inline-affiliate.json <<'JSON'
          {"schema_version": 1, "pages": {}}
          JSON
      - name: Adapt only site-specific validator constants
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('validate_product_cards.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('EXPECTED_SCOPE = {')
          end = s.index('\nPROHIBITED_MODULE_ROOTS', start)
          replacement = '''EXPECTED_SCOPE = {\n    "comparisons": set(),\n    "usages": set(),\n    "guides": set(),\n}\n'''
          s = s[:start] + replacement + s[end:]
          s = s.replace('if total_pages != 19:\n        fail(f"approved product-module scope must remain 19 pages, got {total_pages}")', 'if total_pages != 0:\n        fail(f"approved product-module scope must remain 0 pages before per-page human approval, got {total_pages}")')
          p.write_text(s, encoding='utf-8')

          p = Path('validate_comparisons.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(r'https://bloc-notes-numeriques\.fr/comparatifs/', r'https://cafetiere-italienne\.be/comparatifs/')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove previous custom comparison implementation from active build
        run: |
          rm -f scripts/comparison-content-induction.mjs validate_comparison_workflow.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          data=json.loads(p.read_text())
          data['scripts']['build']='node scripts/build.mjs'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Add exact-port integration report
        run: |
          cat > .content/reviews/comparison-exact-port-2026-09-13.md <<'MD'
          # Exact port — Bloc Notes comparison workflow

          Source: `MarcW88/bloc-notes-numerique`  
          Pinned commit: `534e9fd7e0fc2f7bd83da5b053987ac327c4e9fe`

          ## Vendored unchanged

          - `comparison-analysis-workflow` complete directory
          - `comparison-content-workflow` complete directory
          - all 14 upstream/reused skills listed in the Bloc Notes inventory
          - `apply_comparison_content.py`
          - `apply_comparison_indexation.py`
          - `comparison_content.py`
          - `comparison_bespoke_output.py`
          - `comparison_bespoke_remaining_20260909.py`
          - `comparison_products.py`
          - `generate_comparison_metadata.py`
          - product-card / inline-affiliate rendering scripts
          - product-card / inline-affiliate assets
          - `regenerate-comparisons.yml`, `apply-product-modules.yml`, `maintain-inline-affiliate-links.yml`

          Exact upstream copies of files that require site-specific adaptation are preserved under `.upstream/bloc-notes-comparison/`.

          ## Site-specific adaptation only

          - project/domain/quality reference in `comparison-workflow.config.yaml`
          - `comparison_pages.py`: six Cafetière comparison URLs and their intent/JTBD
          - `comparison_bespoke_priority_20260909.py`: transition adapter preserving current bodies until each page is rewritten
          - `comparison_publication.py`: empty indexation manifest
          - product registry/placements: source schema, no approved commerce module before page-by-page review
          - `validate_product_cards.py`: expected site scope only; upstream original preserved
          - `validate_comparisons.py`: canonical host only; upstream original preserved
          - `comparison-workflow.cafetiere-extension.yaml`: GEO/AEO extension and site publication state

          No comparison content is approved by this port. A fresh `CLUSTER_AUDIT` using the exact upstream workflow is required before any page rewrite.
          MD
      - name: Smoke-test exact engine on current six pages
        run: |
          python apply_comparison_content.py
          python generate_comparison_metadata.py
          python apply_comparison_indexation.py
          python apply_product_cards.py comparisons
          python validate_product_cards.py comparisons
          python validate_comparisons.py
          npm run check
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "workflow: integrate exact Bloc Notes comparison engine"
          git push origin HEAD:comparison-workflow-exact-port
