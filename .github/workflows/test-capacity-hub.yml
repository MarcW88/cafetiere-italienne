name: Test reviewed capacity hub

on:
  push:
    branches:
      - capacity-cluster-audit-guide-exact
    paths:
      - 'scripts/capacity-hub-reviewed.mjs'
      - 'scripts/apply-capacity-hub-reviewed.mjs'
      - 'scripts/build.mjs'
      - 'scripts/check.mjs'
      - 'package.json'
      - 'validate_capacities.py'
      - 'capacity_publication.py'
      - '.content/capacities/**'
      - '.content/briefs/capacites-hub.md'
      - '.github/workflows/test-capacity-hub.yml'

permissions:
  contents: read

jobs:
  validate-capacity-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reviewed site
        run: npm run build
      - name: Check generated site
        run: npm run check
      - name: Validate capacity publication blockers
        run: python3 validate_capacities.py
      - name: Validate reviewed hub markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page = Path('capacites/index.html').read_text(encoding='utf-8')
          required = [
              'Quelle taille de cafetière italienne choisir ?',
              '« 4 tasses » peut vouloir dire 150, 170 ou 185 ml',
              'Trois questions suffisent généralement pour choisir la bonne taille',
              'Le marché ne se limite pas à 2, 4, 6, 10 et 12 tasses',
              'Si votre plaque ou le modèle compte davantage, changez de parcours',
              'id="sources"',
              'Moka Express 9',
              'CRISTEL Torino 10',
              'Alessi 9090 10',
          ]
          missing = [x for x in required if x not in page]
          if missing:
              raise SystemExit('FAIL missing reviewed hub markers: ' + ', '.join(missing))
          if 'name="robots" content="noindex,follow"' not in page:
              raise SystemExit('FAIL capacity hub must remain noindex,follow')
          if re.search(r'\b(?:2|4|6|10|12)\s+tasses?\s*=\s*\d+\s+personnes?', page, re.I):
              raise SystemExit('FAIL unsupported cups-to-people equation')
          for target in [
              '/comparatifs/cafetiere-italienne-induction/',
              '/comparatifs/',
              '/capacites/cafetiere-italienne-2-tasses/',
              '/capacites/cafetiere-italienne-12-tasses/',
          ]:
              if target not in page:
                  raise SystemExit(f'FAIL missing internal handoff {target}')
          print('PASS: reviewed /capacites/ hub markers and boundaries are valid')
          PY
