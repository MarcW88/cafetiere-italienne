name: Regenerate and quality-check Brand cluster

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/brand-content.mjs'
      - 'scripts/build.mjs'
      - '.content/brands/**'
      - '.content/reviews/brand-analysis-**'
      - '.agents/skills/brand-analysis-workflow/**'
      - '.agents/skills/brand-content-workflow/**'
      - '.agents/skills/content-audit/**'
      - '.agents/skills/content-refresh/**'
      - '.agents/skills/search-intent/**'
      - '.agents/skills/fact-check/**'
      - '.agents/skills/evidence-based-reviews/**'
      - '.agents/skills/affiliate-value/**'
      - '.agents/skills/humanizer/**'
      - '.agents/skills/general-writing/**'
      - '.agents/skills/anti-ai-slop/**'
      - '.agents/skills/internal-linking-audit/**'
      - '.agents/skills/seo-technical/**'
      - '.agents/skills/seo-best-practices/**'
      - '.agents/skills/editorial-qa/**'
      - 'brand-workflow.config.yaml'
      - 'validate_brand_quality.py'
      - 'package.json'
      - '.github/workflows/regenerate-brands.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-brand-cluster
  cancel-in-progress: true

jobs:
  regenerate-brands:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate site from current JS content modules
        run: npm run build

      - name: Validate all internal links
        run: npm run check

      - name: Validate Brand machine blockers
        run: python3 validate_brand_quality.py

      - name: Commit regenerated Brand output
        shell: bash
        run: |
          git config user.name "Marc Williame"
          git config user.email "146358493+MarcW88@users.noreply.github.com"
          git add marques/
          if git diff --cached --quiet; then
            echo "No generated Brand changes to commit"
          else
            git commit -m "content: regenerate brands from reviewed sources"
            git push origin HEAD:${{ github.ref_name }}
          fi
