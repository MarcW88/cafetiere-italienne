name: Temporary troubleshooting finish guide build

on:
  push:
    branches:
      - guides-troubleshooting-finish

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire final Guides and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          build = Path('scripts/build.mjs')
          text = build.read_text(encoding='utf-8')
          import_line = "import { guideTroubleshootingPages } from './guide-content-troubleshooting.mjs';"
          if import_line not in text:
              text = text.replace(
                  "import { guideMaterialsCarePages } from './guide-content-materials-care.mjs';\n",
                  "import { guideMaterialsCarePages } from './guide-content-materials-care.mjs';\n" + import_line + "\n",
                  1,
              )
          old = "const custom=cat==='guides'?(guidePages[slug]||guideHowToPages[slug]||guideFirstUsePages[slug]||guideBrewBasicsPages[slug]||guideMaterialsCarePages[slug]):null;"
          new = "const custom=cat==='guides'?(guidePages[slug]||guideHowToPages[slug]||guideFirstUsePages[slug]||guideBrewBasicsPages[slug]||guideMaterialsCarePages[slug]||guideTroubleshootingPages[slug]):null;"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Could not wire guideTroubleshootingPages into build')
          build.write_text(text, encoding='utf-8')
          PY

          npm run build
          npm run check
          python3 validate_guide_quality.py

          for slug in cafetiere-italienne-cafe-amer-brule cafetiere-italienne-fuite-vapeur changer-joint-cafetiere-italienne cafetiere-italienne-vs-espresso; do
            page="guides/$slug/index.html"
            test -f "$page"
            grep -q '<meta name="robots" content="noindex,follow">' "$page"
            grep -q '<article class="guide-article content-main">' "$page"
            grep -q 'id="sources"' "$page"
            grep -q "https://cafetiere-italienne.be/guides/$slug/" "$page"
          done

          git add scripts/build.mjs guides/cafetiere-italienne-cafe-amer-brule/index.html guides/cafetiere-italienne-fuite-vapeur/index.html guides/changer-joint-cafetiere-italienne/index.html guides/cafetiere-italienne-vs-espresso/index.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: build final moka guide cluster"
          git push origin HEAD:guides-troubleshooting-finish
