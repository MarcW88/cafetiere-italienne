name: TEMP build remaining exact comparisons

on:
  push:
    branches: [rewrite-remaining-comparisons-exact]
    paths:
      - ".github/workflows/temp-build-remaining-comparisons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite-remaining-comparisons-exact
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synchronize reviewed statuses
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          slugs = [
              'meilleure-cafetiere-italienne',
              'cafetiere-italienne-inox',
              'cafetiere-italienne-electrique',
              'cafetiere-italienne-design',
              'petite-cafetiere-italienne',
          ]
          for slug in slugs:
              path = Path('.content/comparisons') / f'{slug}.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              data['status'] = 'READY_FOR_HUMAN_VALIDATION'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify final publish reviews
        run: |
          grep -q 'PASS — READY_FOR_HUMAN_VALIDATION' .content/reviews/meilleure-cafetiere-italienne-exact-2026-09-13.md
          grep -q 'PASS — READY_FOR_HUMAN_VALIDATION' .content/reviews/cafetiere-italienne-inox-exact-2026-09-13.md
          grep -q 'PASS — READY_FOR_HUMAN_VALIDATION' .content/reviews/cafetiere-italienne-electrique-exact-2026-09-13.md
          grep -q 'PASS — READY_FOR_HUMAN_VALIDATION' .content/reviews/cafetiere-italienne-design-exact-2026-09-13.md
          grep -q 'PASS — READY_FOR_HUMAN_VALIDATION' .content/reviews/petite-cafetiere-italienne-exact-2026-09-13.md
      - name: Reapply exact Bloc Notes comparison engine
        run: |
          python apply_comparison_content.py
          python generate_comparison_metadata.py
          python apply_comparison_indexation.py
      - name: Revalidate product and comparison layers
        run: |
          python apply_product_cards.py comparisons
          python validate_product_cards.py comparisons
          python validate_comparisons.py
      - name: Check site integrity
        run: npm run check
      - name: Verify reviewed state and no HTML drift
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          slugs = [
              'meilleure-cafetiere-italienne',
              'cafetiere-italienne-inox',
              'cafetiere-italienne-electrique',
              'cafetiere-italienne-design',
              'petite-cafetiere-italienne',
          ]
          for slug in slugs:
              data = json.loads((Path('.content/comparisons') / f'{slug}.json').read_text(encoding='utf-8'))
              assert data['status'] == 'READY_FOR_HUMAN_VALIDATION', slug
              html = (Path('comparatifs') / slug / 'index.html').read_text(encoding='utf-8')
              assert 'noindex,follow' in html, slug
          PY
          html_drift=$(git diff --name-only | grep '^comparatifs/' || true)
          if [ -n "$html_drift" ]; then
            echo "Unexpected HTML drift after final review:"
            echo "$html_drift"
            exit 1
          fi
      - name: Commit reviewed statuses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .content/comparisons/meilleure-cafetiere-italienne.json \
            .content/comparisons/cafetiere-italienne-inox.json \
            .content/comparisons/cafetiere-italienne-electrique.json \
            .content/comparisons/cafetiere-italienne-design.json \
            .content/comparisons/petite-cafetiere-italienne.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "review: mark remaining comparisons ready for human validation"
          git push origin HEAD:rewrite-remaining-comparisons-exact
