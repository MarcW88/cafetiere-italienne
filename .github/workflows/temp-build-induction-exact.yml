name: TEMP build exact induction comparison

on:
  push:
    branches: [rewrite-comparison-induction-exact]
    paths:
      - ".github/workflows/temp-build-induction-exact.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite-comparison-induction-exact
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact Bloc Notes comparison engine
        run: |
          python apply_comparison_content.py
          python generate_comparison_metadata.py
          python apply_comparison_indexation.py
      - name: Validate product and comparison layers
        run: |
          python apply_product_cards.py comparisons
          python validate_product_cards.py comparisons
          python validate_comparisons.py
      - name: Check site integrity
        run: npm run check
      - name: Verify induction rewrite markers
        run: |
          grep -q "Commencez par votre plaque, pas par la marque" comparatifs/cafetiere-italienne-induction/index.html
          grep -q "Les modèles que nous avons reconsidérés" comparatifs/cafetiere-italienne-induction/index.html
          grep -q "analyse documentaire" comparatifs/cafetiere-italienne-induction/index.html
          grep -q "noindex,follow" comparatifs/cafetiere-italienne-induction/index.html
          grep -q "Serious Eats" comparatifs/cafetiere-italienne-induction/index.html
      - name: Ensure only induction comparison HTML changed
        run: |
          git diff --name-only | tee /tmp/changed.txt
          bad=$(grep '^comparatifs/' /tmp/changed.txt | grep -v '^comparatifs/cafetiere-italienne-induction/index.html$' || true)
          if [ -n "$bad" ]; then
            echo "Unexpected comparison page changes:"
            echo "$bad"
            exit 1
          fi
      - name: Commit generated induction HTML
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comparatifs/cafetiere-italienne-induction/index.html
          git commit -m "content: generate exact-workflow induction comparison"
          git push origin HEAD:rewrite-comparison-induction-exact
