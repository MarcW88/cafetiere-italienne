name: Validate guarded product modules

on:
  push:
    branches: [main]
    paths:
      - '.content/products/**'
      - '.content/comparisons/**'
      - 'comparison-workflow.config.yaml'
      - 'validate_comparison_workflow.py'
      - '.github/workflows/apply-product-modules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate product registry and comparison references
        run: python3 validate_comparison_workflow.py
