name: Visual design review

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate approved editorial images with BFL"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "index.html"
      - "marques/**"
      - "comparatifs/**"
      - "modeles/**"
      - "capacites/**"
      - "guides/**"
      - "accessoires/**"
      - "cafe-moka/**"
      - "a-propos/**"
      - "notre-methode/**"
      - "affiliation/**"
      - "contact/**"
      - "assets/**"
      - "scripts/**"
      - "*.py"
      - "comparisons.css"
      - ".content/products/**"
      - "DESIGN.md"
      - ".agents/skills/site-design-review/**"
      - ".agents/skills/anti-ai-slop/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual-design-review.yml"
  pull_request:
    paths:
      - "index.html"
      - "marques/**"
      - "comparatifs/**"
      - "modeles/**"
      - "capacites/**"
      - "guides/**"
      - "accessoires/**"
      - "cafe-moka/**"
      - "a-propos/**"
      - "notre-methode/**"
      - "affiliation/**"
      - "contact/**"
      - "assets/**"
      - "scripts/**"
      - "*.py"
      - "comparisons.css"
      - ".content/products/**"
      - "DESIGN.md"
      - ".agents/skills/site-design-review/**"
      - ".agents/skills/anti-ai-slop/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual-design-review.yml"

permissions:
  contents: read

jobs:
  visual-pages:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(images): generate approved editorial images'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scope: [brands, comparisons, models, capacities, guides, accessories, cafe-moka, trust]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Check internal links
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Force images eager for deterministic screenshots
        shell: bash
        run: |
          find marques comparatifs modeles capacites guides accessoires cafe-moka a-propos notre-methode affiliation contact \
            -name '*.html' -type f -print0 \
            | xargs -0 -r sed -i 's/loading="lazy"/loading="eager"/g'

      - name: Capture ${{ matrix.scope }} pages
        run: >-
          node .agents/skills/site-design-review/scripts/run-visual-review.mjs
          --scope ${{ matrix.scope }}
          --output .artifacts/design-review/${{ matrix.scope }}

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scope }}-design-review
          path: .artifacts/design-review/${{ matrix.scope }}/
          if-no-files-found: warn
          retention-days: 14

  visual-home:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(images): generate approved editorial images'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Check internal links
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Force homepage images eager for deterministic screenshots
        run: sed -i 's/loading="lazy"/loading="eager"/g' index.html

      - name: Capture homepage
        run: >-
          node .agents/skills/site-design-review/scripts/run-visual-review.mjs
          --route /
          --output .artifacts/design-review/home

      - name: Upload homepage visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-design-review
          path: .artifacts/design-review/home/
          if-no-files-found: warn
          retention-days: 14
