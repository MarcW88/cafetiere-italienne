name: Test exact capacity workflow on 12-tasses

on:
  push:
    branches: [capacity-12-tasses-exact-workflow]

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site
        run: npm run build
      - name: Check site
        run: npm run check
      - name: Validate capacity cluster
        run: python3 validate_capacities.py
      - name: Verify 12-tasses exact-workflow output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('capacites/cafetiere-italienne-12-tasses/index.html')
          t = p.read_text(encoding='utf-8')
          assert 'Cafetière italienne 12 tasses : combien de ml ?' in t
          assert '595 ml' in t
          assert '600 ml' in t
          assert '717 ml' in t
          assert 'volume approximatif de café préparé' in t
          assert 'capacité annoncée' in t
          assert "quantité d’eau" in t
          assert 'Mokclassic 1200' in t
          assert 'Miss Moka Prestige' in t
          assert 'HAEGER Moka Pot 12' in t
          assert '<meta name="robots" content="noindex,follow">' in t
          assert 'https://cafetiere-italienne.be/capacites/cafetiere-italienne-12-tasses/' in t
          assert '—' not in t
          assert '–' not in t
          low = t.lower()
          for bad in ['nous avons testé', 'notre test', 'top 5', 'notre classement', 'score sur 10', '12 tasses = 12 personnes']:
              assert bad not in low, bad
          assert '/capacites/cafetiere-italienne-10-tasses/' in t
          assert '/comparatifs/cafetiere-italienne-induction/' in t
          assert '/comparatifs/' in t
          print('PASS: 12-tasses exact-workflow output')
          PY
      - name: Verify other reviewed capacity HTML unchanged
        run: |
          git fetch origin main
          git diff --exit-code origin/main -- \
            capacites/cafetiere-italienne-2-tasses/index.html \
            capacites/cafetiere-italienne-4-tasses/index.html \
            capacites/cafetiere-italienne-6-tasses/index.html \
            capacites/cafetiere-italienne-10-tasses/index.html
      - name: Persist reviewed 12-tasses HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add capacites/cafetiere-italienne-12-tasses/index.html
          if git diff --cached --quiet; then
            echo 'No generated HTML changes to commit'
          else
            git commit -m 'build: render exact-workflow 12-tasses page'
            git push
          fi
