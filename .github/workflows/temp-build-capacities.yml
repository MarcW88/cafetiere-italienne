name: Temporary capacity build

on:
  push:
    branches:
      - capacity-pages

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire capacity pages and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          build=Path('scripts/build.mjs')
          text=build.read_text(encoding='utf-8')
          import_line="import { capacityPages, capacityHub } from './capacity-content.mjs';"
          if import_line not in text:
              anchor="import { modelPages } from './model-content.mjs';\n"
              if anchor not in text: raise SystemExit('capacity import anchor missing')
              text=text.replace(anchor,anchor+import_line+'\n',1)
          old="const custom=cat==='guides'?(guidePages[slug]||guideHowToPages[slug]||guideFirstUsePages[slug]||guideBrewBasicsPages[slug]||guideMaterialsCarePages[slug]||guideTroubleshootingPages[slug]):cat==='comparatifs'?comparisonPages[slug]:cat==='marques'?brandPages[slug]:cat==='modeles'?modelPages[slug]:null;"
          new="const custom=cat==='guides'?(guidePages[slug]||guideHowToPages[slug]||guideFirstUsePages[slug]||guideBrewBasicsPages[slug]||guideMaterialsCarePages[slug]||guideTroubleshootingPages[slug]):cat==='comparatifs'?comparisonPages[slug]:cat==='marques'?brandPages[slug]:cat==='modeles'?modelPages[slug]:cat==='capacites'?capacityPages[slug]:null;"
          if old in text: text=text.replace(old,new,1)
          elif new not in text: raise SystemExit('capacity custom anchor missing')
          marker="}else if(cat==='modeles'){fs.writeFileSync(path.join(dir,'index.html'),shell('Modèles de cafetières italiennes'"
          if marker in text and "capacityHub.title" not in text:
              needle="}else{fs.writeFileSync(path.join(dir,'index.html'),shell(labels[cat],"
              repl="}else if(cat==='capacites'){fs.writeFileSync(path.join(dir,'index.html'),shell(capacityHub.title,capacityHub.body,capacityHub.description,{robots:'noindex,follow',canonical:capacityHub.canonical}));}else{fs.writeFileSync(path.join(dir,'index.html'),shell(labels[cat],"
              # Replace the generic else nearest the model hub only once.
              model_pos=text.find(marker)
              else_pos=text.find(needle,model_pos)
              if else_pos<0: raise SystemExit('capacity hub generic else missing')
              text=text[:else_pos]+repl+text[else_pos+len(needle):]
          elif "canonical:capacityHub.canonical" not in text:
              raise SystemExit('capacity hub anchor missing')

          # Correct the homepage capacity shortcuts so they no longer assert a universal cups-to-people mapping.
          old_sizes="[['2','≈ 90 ml','1 personne'],['4','≈ 180 ml','1–2 personnes'],['6','≈ 270 ml','2–3 personnes'],['10','≈ 450 ml','4–5 personnes'],['12','≈ 540 ml','5–6 personnes']]"
          new_sizes="[['2','≈ 85–100 ml','Petit volume'],['4','≈ 150–185 ml','Intermédiaire'],['6','≈ 235–280 ml','Généreux'],['10','Selon la gamme','Non standard'],['12','≈ 595 ml','Grande capacité']]"
          if old_sizes in text: text=text.replace(old_sizes,new_sizes,1)
          old_q='<h3>Combien de personnes ?</h3><div class="options"><button class="option" data-key="taille" data-value="2 tasses">1</button><button class="option" data-key="taille" data-value="4 tasses">2</button><button class="option" data-key="taille" data-value="6 tasses">3–4</button><button class="option" data-key="taille" data-value="10 tasses">5+</button></div>'
          new_q='<h3>Quel volume préparez-vous le plus souvent ?</h3><div class="options"><button class="option" data-key="taille" data-value="2 tasses">≈ 90 ml</button><button class="option" data-key="taille" data-value="4 tasses">≈ 160–180 ml</button><button class="option" data-key="taille" data-value="6 tasses">≈ 250 ml</button><button class="option" data-key="taille" data-value="12 tasses">≈ 600 ml</button></div>'
          if old_q in text: text=text.replace(old_q,new_q,1)
          text=text.replace('<strong>La bonne taille</strong>2, 4, 6 ou 10 tasses ?','<strong>La bonne taille</strong>2, 4, 6, 10 ou 12 tasses ?',1)
          build.write_text(text,encoding='utf-8')
          css=Path('assets/styles.css')
          c=css.read_text(encoding='utf-8')
          if '/* Capacity editorial content */' not in c:
              c += "\n\n/* Capacity editorial content */\n.capacity-layout{align-items:start}\n"
              css.write_text(c,encoding='utf-8')
          PY

          npm run build
          npm run check
          python3 validate_capacities.py
          for slug in cafetiere-italienne-2-tasses cafetiere-italienne-4-tasses cafetiere-italienne-6-tasses cafetiere-italienne-10-tasses cafetiere-italienne-12-tasses; do
            page="capacites/$slug/index.html"
            grep -q '<meta name="robots" content="noindex,follow">' "$page"
            grep -q '<article class="content-main">' "$page"
            grep -q 'id="sources"' "$page"
          done
          grep -q '<meta name="robots" content="noindex,follow">' capacites/index.html
          git add scripts/build.mjs assets/styles.css capacites index.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: build capacity cluster"
          git push origin HEAD:capacity-pages
