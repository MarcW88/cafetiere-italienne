name: Temporary first guide build

on:
  push:
    branches:
      - guide-comment-choisir

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete guide workflow and validate
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          guide = Path('scripts/guide-content.mjs')
          text = guide.read_text(encoding='utf-8')
          text = text.replace('<article class="guide-article">', '<article class="guide-article content-main">')
          text = text.replace('<h2>Sources vérifiées</h2>', '<h2 id="sources">Sources vérifiées</h2>')
          guide.write_text(text, encoding='utf-8')

          build = Path('scripts/build.mjs')
          text = build.read_text(encoding='utf-8')
          old_hub = "fs.writeFileSync(path.join(dir,'index.html'),shell(labels[cat],`<section class=\"page-hero\"><div class=\"container\"><div class=\"breadcrumbs\"><a href=\"/\">Accueil</a> · ${labels[cat]}</div><span class=\"eyebrow\">Explorer</span><h1>${labels[cat]}</h1><p>Retrouvez toutes les pages prévues pour cette rubrique. Les contenus éditoriaux seront ajoutés ultérieurement.</p></div></section><section class=\"section\"><div class=\"container directory\">${links}</div></section>`));"
          new_hub = "fs.writeFileSync(path.join(dir,'index.html'),shell(labels[cat],`<section class=\"page-hero\"><div class=\"container\"><div class=\"breadcrumbs\"><a href=\"/\">Accueil</a> · ${labels[cat]}</div><span class=\"eyebrow\">Explorer</span><h1>${labels[cat]}</h1><p>Retrouvez toutes les pages prévues pour cette rubrique. Les contenus éditoriaux seront ajoutés ultérieurement.</p></div></section><section class=\"section\"><div class=\"container directory\">${links}</div></section>`,undefined,cat==='guides'?{robots:'index,follow',canonical:'/guides/'}:{}));"
          if old_hub in text:
              text = text.replace(old_hub, new_hub)

          needle = "</aside></div>`));}"
          replacement = "</aside></div>`,undefined,cat==='guides'?{robots:'noindex,follow',canonical:`/guides/${slug}/`}:{}));}"
          if needle in text:
              text = text.replace(needle, replacement, 1)
          build.write_text(text, encoding='utf-8')
          PY

          cat > publication_indexation.py <<'PY'
          """Explicit indexation state for the progressively authored Guide cluster."""

          # The Guide hub is already a navigational page. Individual Guide articles
          # remain noindex,follow until explicit human validation and indexation approval.
          INDEXABLE_GUIDE_ROUTES = {
              "/guides/",
          }
          PY

          curl -fsSL https://raw.githubusercontent.com/MarcW88/bloc-notes-numerique/main/validate_guide_quality.py -o validate_guide_quality.py
          python3 - <<'PY'
          from pathlib import Path

          p = Path('validate_guide_quality.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('SITE_ORIGIN = "https://bloc-notes-numeriques.fr"', 'SITE_ORIGIN = "https://cafetiere-italienne.be"')
          text = text.replace('    "<!-- Contenu à rédiger -->",', '    "<!-- Contenu à rédiger -->",\n    "Zone de contenu à rédiger.",')

          marker = '\ndef inspect_hub() -> list[str]:\n'
          draft_fn = r'''
def inspect_noindex_placeholder(page: Path) -> list[str]:
    page_html = page.read_text(encoding="utf-8")
    issues = []
    route = route_for_page(page)

    robots = ROBOTS_RE.findall(page_html)
    normalized = [",".join(part.strip().lower() for part in value.split(",")) for value in robots]
    if "noindex,follow" not in normalized:
        issues.append("placeholder Guide must remain noindex,follow")

    canonicals = CANONICAL_RE.findall(page_html)
    expected = expected_canonical(page)
    if canonicals != [expected]:
        issues.append(f"canonical mismatch: {canonicals} != {[expected]}")

    title = TITLE_RE.findall(page_html)
    h1s = H1_RE.findall(page_html)
    descriptions = META_DESCRIPTION_RE.findall(page_html)
    if len(title) != 1 or not clean_text(title[0]):
        issues.append("missing or empty <title>")
    if len(h1s) != 1 or not clean_text(h1s[0]):
        issues.append("missing or empty H1")
    if len(descriptions) != 1 or not descriptions[0].strip():
        issues.append("missing or empty meta description")
    return issues

'''
          if 'def inspect_noindex_placeholder' not in text:
              text = text.replace(marker, draft_fn + marker)

          old = '''    for page in pages:\n        issues = inspect(page)\n        if issues:\n            failures[page.parent.name] = issues\n'''
          new = '''    for page in pages:\n        page_html = page.read_text(encoding="utf-8")\n        is_placeholder = any(marker.lower() in page_html.lower() for marker in PLACEHOLDER_PATTERNS)\n        issues = inspect_noindex_placeholder(page) if is_placeholder else inspect(page)\n        if issues:\n            failures[page.parent.name] = issues\n'''
          if old not in text:
              raise SystemExit('Could not adapt validator main loop')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY

          npm run build
          npm run check
          python3 validate_guide_quality.py

          grep -q '<article class="guide-article content-main">' guides/comment-choisir-cafetiere-italienne/index.html
          grep -q '<meta name="robots" content="noindex,follow">' guides/comment-choisir-cafetiere-italienne/index.html
          grep -q '<link rel="canonical" href="https://cafetiere-italienne.be/guides/comment-choisir-cafetiere-italienne/">' guides/comment-choisir-cafetiere-italienne/index.html

          git add scripts/guide-content.mjs scripts/build.mjs assets/styles.css guides validate_guide_quality.py publication_indexation.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: enforce guide publication gates"
          git push origin HEAD:guide-comment-choisir
